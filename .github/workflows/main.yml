name: CI

on:
  pull_request:
    branches: [main, MR1]
  push:
    branches: [main, MR1] 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Test and Check
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build, Check and Coverage
        run: ./gradlew --continue --stacktrace --console=plain assemble check printCoverage

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always() # Выполнять всегда, даже если тесты упали, чтобы показать отчёт
        with:
          report_paths: 'build/test-results/test/TEST-*.xml'
          check_name: 'JUnit Test Report'


      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports-and-libs
          path: |
            build/libs/
            build/reports/checkstyle/
            build/reports/tests/
            build/reports/jacoco/
          retention-days: 7 